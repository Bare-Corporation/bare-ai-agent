# Gitleaks secret scan - fail-closed CI gate (push + PR).
# Uses the repo-root .gitleaks.toml (shipped config extending defaults with
# custom rules) and .gitleaksignore (benign baseline only).
# Any finding fails the job, blocking merge. gitleaks v8.30.1.

name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (v8.30.1)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan full history (fail-closed)
        run: ./gitleaks git --redact --no-banner --verbose
